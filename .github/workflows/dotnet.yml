name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # 1. Usar .NET 10 en vez de 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 2. Indicarle la ruta exacta de tu proyecto
    - name: Restore dependencies
      run: dotnet restore 4VGym_BBDD/4VGym_BBDD.csproj

    - name: Build
      run: dotnet build 4VGym_BBDD/4VGym_BBDD.csproj --no-restore
